# Ground truth for AirPods Pro 2. Data only - rule logic lives in rules_engine.py.
#
# EVERY factual entry carries a `source`. Nothing goes in this file because it
# sounds right; if it has no source it does not belong here. Sources used:
#
#   apple-identify   Apple, "Identify your AirPods" (support.apple.com)
#   owner            Project owner, domain expert in AirPods authentication
#   community-guide  r/AreMyAirpodsAuthentic, "How To Tell If Your Airpod Pros
#                    Are Fake - A Comprehensive and Definitive Guide"
#
# Precedence when sources disagree: apple-identify > owner > community-guide.

product:
  name: AirPods Pro 2
  generation: 2

variants:
  - id: Pro 2 USB-C
    introduced: 2023
    source: apple-identify
  - id: Pro 2 Lightning
    introduced: 2022
    source: apple-identify

# Apple lists the three set numbers together without saying which is the left
# earbud, the right earbud, or the case. Where the component is genuinely
# unspecified by the source it is left null rather than guessed - the rule only
# needs set membership and variant, so inventing the mapping would add
# unsourced detail to the ledger for no benefit.
model_numbers:
  - number: A3047
    variant: Pro 2 USB-C
    component: null
    source: apple-identify
  - number: A3048
    variant: Pro 2 USB-C
    component: null
    source: apple-identify
  - number: A3049
    variant: Pro 2 USB-C
    component: null
    source: apple-identify
  - number: A2968
    variant: Pro 2 USB-C
    component: MagSafe Charging Case (USB-C)
    source: apple-identify   # Apple names this one explicitly as the case
  - number: A2931
    variant: Pro 2 Lightning
    component: null
    source: apple-identify
  - number: A2699
    variant: Pro 2 Lightning
    component: null
    source: apple-identify
  - number: A2698
    variant: Pro 2 Lightning
    component: null
    source: apple-identify
  - number: A2700
    variant: Pro 2 Lightning
    component: MagSafe Charging Case (Lightning)
    source: apple-identify   # Apple names this one explicitly as the case

# Other AirPods Pro generations. These are recorded for IDENTIFICATION ONLY -
# this tool verifies Pro 2 and nothing else. Without them, an A-number from
# another generation is indistinguishable from a fabricated one, and the schema
# forces the extractor to mislabel the product as a Pro 2.
#
# Corpus evidence for why this matters: A3063 appeared on one confirmed
# counterfeit and one confirmed genuine unit. It is an AirPods Pro 3 number -
# the posts were a fake Pro 3 and a real one, and the tool could not say so.
# Other AirPods products, for IDENTIFICATION ONLY - this tool verifies Pro 2 and
# nothing else. Without them an A-number from another generation is
# indistinguishable from a fabricated one, and the extractor is forced to
# mislabel the product as a Pro 2.
#
# Earbuds and charging cases are listed SEPARATELY because Apple lists them
# separately and their years differ. An earlier version of this file merged them,
# which put A3059 (a 2024 case) inside the AirPods 4 ANC earbud entry and dated
# every AirPods Max to 2020.
other_generations:
  - name: AirPods Pro 3
    introduced: 2025
    numbers: [A3063, A3064, A3065]
    source: apple-identify
  - name: AirPods Pro 1
    introduced: 2019
    numbers: [A2084, A2083]
    source: apple-identify
  - name: AirPods 4 with Active Noise Cancellation
    introduced: 2024
    numbers: [A3056, A3055, A3057]
    source: apple-identify
  - name: AirPods 4
    introduced: 2024
    numbers: [A3053, A3050, A3054]
    source: apple-identify
  - name: AirPods 3
    introduced: 2021
    numbers: [A2565, A2564]
    source: apple-identify
  - name: AirPods 2
    introduced: 2019
    numbers: [A2032, A2031]
    source: apple-identify
  - name: AirPods 1
    introduced: 2016
    numbers: [A1523, A1722]
    source: apple-identify
  - name: AirPods Max 2
    introduced: 2026
    numbers: [A3454]
    source: apple-identify
  - name: AirPods Max 1 (USB-C)
    introduced: 2024
    numbers: [A3184]
    source: apple-identify
  - name: AirPods Max 1 (Lightning)
    introduced: 2020
    numbers: [A2096]
    source: apple-identify

# Charging cases, which carry their own model numbers and years.
charging_cases:
  - name: Wireless Charging Case for AirPods 4 (ANC)
    introduced: 2024
    numbers: [A3059]
    source: apple-identify
  - name: Charging Case for AirPods 4
    introduced: 2024
    numbers: [A3058]
    source: apple-identify
  - name: MagSafe Charging Case for AirPods Pro 3
    introduced: 2025
    numbers: [A3122]
    source: apple-identify
  - name: Lightning Charging Case for AirPods 3
    introduced: 2022
    numbers: [A2897]
    source: apple-identify
  - name: MagSafe Charging Case for AirPods 3
    introduced: 2021
    numbers: [A2566]
    source: apple-identify
  # A2190 covers TWO different cases distinguished only by serial suffix.
  - name: MagSafe Charging Case for AirPods Pro 1
    introduced: 2021
    numbers: [A2190]
    serial_last_four: [1059, 1NRC]
    source: apple-identify
  - name: AirPods Pro 1 Charging Case
    introduced: 2019
    numbers: [A2190]
    serial_last_four: [0C6L, LKKT]
    source: apple-identify
  - name: Wireless Charging Case (AirPods 1 and 2)
    introduced: 2019
    numbers: [A1938]
    source: apple-identify
  - name: Lightning Charging Case (AirPods 1 and 2)
    introduced: 2016
    numbers: [A1602]
    source: apple-identify

# A checkable constraint Apple states outright: the last four characters of an
# AirPods Pro 1 case serial are drawn from a fixed set. Anything else on an
# A2190 case is not a genuine Apple serial for that case.
#
# Validated against the owner's genuine Pro 1 label, whose serial ends 1059 -
# the MagSafe Charging Case for AirPods Pro 1.
#
# Not implemented as a rule yet: this tool verifies Pro 2, and Apple publishes no
# equivalent suffix constraint for the Pro 2 cases. Recorded so it is ready when
# Pro 1 verification is added.
case_serial_suffixes:
  A2190:
    - suffixes: [1059, 1NRC]
      case: MagSafe Charging Case for AirPods Pro 1
      introduced: 2021
    - suffixes: [0C6L, LKKT]
      case: AirPods Pro 1 Charging Case
      introduced: 2019
  source: apple-identify

# The `max` values below are OBSERVED ceilings - the latest year seen on a
# handful of genuine boxes - and they do not move when the calendar does. They
# no longer convict. On 2026-09-08 the ceiling stood at 2025 while the date was
# 2026, so a genuine box reprinted this year was being called HIGH RISK; the
# rule now reports a year above the ceiling and charges only a year later than
# the present one, which is the single bound that cannot go stale. Measured
# cost on the corpus: none. The only item the ceiling convicted is post 9, a
# confirmed counterfeit that fails Typography & Print Quality as well.
# The `min` values still convict: a box cannot predate its product.
copyright_years:
  Pro 2 USB-C:
    min: 2023
    max: 2025
    source: apple-identify (introduced 2023); owner (observed ceiling 2025)
  Pro 2 Lightning:
    min: 2022
    max: 2025
    source: apple-identify (introduced 2022); owner (observed ceiling 2025)

# Part numbers observed on real units, and the regulatory marks beside them.
# Collected as EVIDENCE, not yet as a rule. A region-consistency check needs a
# sourced mapping from region suffix to expected marks, and one CSA sighting on
# one North American box is not that.
observed_part_numbers:
  genuine:
    - {part_number: MTJV3AM/A, product: AirPods Pro 2 USB-C, region_suffix: AM/A,
       origin_line: "Assembled in Vietnam", marks: [CSA Energy Verified Only]}
    - {part_number: MXP93LL/A, product: AirPods 4 (ANC), region_suffix: LL/A,
       origin_line: "Assembled in Vietnam"}
    - {part_number: MXP63LL/A, product: AirPods 4, region_suffix: LL/A,
       origin_line: "Assembled in Vietnam"}
    - {part_number: MLWK3AM/A, product: AirPods Pro 1, region_suffix: AM/A,
       origin_line: "Made in Vietnam"}
  counterfeit:
    - {part_number: MFHP4ZM/A, product: AirPods Pro 3, region_suffix: ZM/A,
       origin_line: "Product of Vietnam"}
    - {part_number: MQD83AM/A, product: AirPods Pro 2 Lightning, region_suffix: AM/A,
       origin_line: "Made in Vietnam", note: corpus post 18}
  source: owner (photographed units) + corpus

# Why the origin wording is NOT a rule, despite looking like one.
#
#   "Assembled in Vietnam"  3 genuine
#   "Made in Vietnam"       1 genuine (AirPods Pro 1) AND 1 counterfeit (post 18)
#   "Product of Vietnam"    1 counterfeit
#
# "Made in" appears on both a genuine unit and a fake, so it discriminates
# nothing. "Product of" appears only on a counterfeit, but on ONE sample, and
# four genuine labels already show two different legitimate wordings - so the
# full set of wordings Apple uses is unknown. Coding "Product of means fake"
# would be an invented specification of the kind that has produced a false
# positive every time this project has tried one.
origin_line_evidence:
  assembled_in_vietnam: {genuine: 3, counterfeit: 0}
  made_in_vietnam: {genuine: 1, counterfeit: 1}
  # The genuine one is the owner's AirPods Pro 3 (knowledge/real_app3), which reads
  # "Product of Vietnam" verbatim. Confirmed genuine by the owner directly on
  # 2026-09-08, which is what promotes it from inference to source - it had
  # previously been called genuine only because a retail price sticker was
  # still attached, and a price sticker is not a provenance.
  product_of_vietnam: {genuine: 1, counterfeit: 1}
  status: insufficient_evidence
  source: owner (photographed units) + corpus

# Regional box variants. Packaging CONTENT varies by region - languages,
# regulatory marks, part-number suffix - so a rule written against one region's
# box does not transfer. Typography does NOT vary: Apple sets every region in
# San Francisco, so the font baseline below is region-independent even though
# the reference photographs are North American.
#
# Only NA is characterised. Do not write content rules for other regions
# without a genuine reference box from that region.
regions:
  - code: AM/A
    name: North America
    reference_photos: knowledge/real_app2
    reference_part_number: MTJV3AM/A
    # NEVER record a genuine serial here. A real, valid serial is precisely what
    # a counterfeiter wants: cloning one produces a fake that passes Apple's own
    # coverage lookup, which is the failure this project exists to detect.
    observed_on_label:
      - "MTJV3AM/A  AirPods Pro (2nd generation)"
      - "Designed by Apple in California. Assembled in Vietnam."
      - "Model A3047 A3048 A2968"
      - "(S) Serial No. <redacted - genuine serial, never record one>"
    regulatory_marks: [CSA (Energy Verified Only)]
    languages: [English, French, Japanese, Spanish]
    source: owner (genuine unit, photographed 2026-09-06)
  - code: ZP/A
    name: Hong Kong
    status: uncharacterised
    source: community-guide (mentioned only)
  - code: ZA/A
    name: Malaysia / Thailand
    status: uncharacterised
    source: community-guide (mentioned only)

# Measured against a confirmed-genuine North American label. Seven usable glyphs
# from the "(S) Serial No." line sat at 1.68% mean deviation from San
# Francisco, 3.34% worst case - so genuine print lands well inside the 8%
# provisional threshold. ONE label is a sanity check, not a calibration; a real
# threshold needs several genuine boxes and at least one confirmed counterfeit.
font_baseline:
  reference_font: San Francisco (/System/Library/Fonts/SFNS.ttf)
  measured_on: knowledge/real_app2/IMG_6337.JPG
  region: AM/A
  line: "(S) Serial No. <redacted>"
  glyphs_measured: 7
  mean_absolute_deviation_percent: 1.68
  max_absolute_deviation_percent: 3.34
  excluded_glyph: Q
  excluded_reason: >-
    Both Q's measured -8.6% and -12.1% on genuine print. SF's Q has a tail
    crossing the bowl whose survival through printing and segmentation varies.
    Passed the synthetic screen; failed against reality.
  source: owner (genuine unit) + measurement

  # The offset above is NOT the signal. Measured on two genuine labels it was
  # +2.4% (AirPods Pro 2) and -6.0% (AirPods 4 ANC) - a difference caused by
  # image scale and ink spread, not typeface. -6.0% is indistinguishable from
  # Arial's synthetic -5.9%, so an absolute-deviation threshold would flag a
  # genuine box.
  #
  # Scatter is the signal. Typefaces differ from one another non-uniformly (SF
  # vs Helvetica: 22% on R, 8% on S), so a wrong font makes per-glyph deviations
  # disagree while genuine print makes them agree. Measured populations:
  #
  #   genuine photographed labels   0.90%   (both boxes, independently)
  #   San Francisco rendered        0.42%
  #   Helvetica / Arial / Verdana / Tahoma   3.3% - 7.9%
  #
  # Threshold set at 2.0%, between the populations rather than at either edge.
  #
  # Digits cannot be scored. Most typefaces set tabular figures, so digits
  # deviate uniformly: on a digits-only line SF scatters 0.71% and Helvetica
  # 0.71%. A line needs at least 3 letters.
  # RESOLUTION IS THE BINDING CONSTRAINT, not the descriptor. Measured 2026-09-07
  # by rendering one label line in San Francisco, Helvetica, Arial and Verdana,
  # degrading each the way a photograph does (optical blur, resampling, sensor
  # noise, JPEG) and scoring all four through the production path. Heights are
  # what median_glyph_height_px reports:
  #
  #     glyph px   SF shape   nearest substitute   separation
  #           23     0.1890               0.1382        0.73x   INVERTED
  #           30     0.0869               0.1101        1.27x   noise
  #           41     0.0684               0.1284        1.88x   usable
  #           54     0.0399               0.1514        3.79x   usable
  #          106     0.0385               0.1043        2.71x   usable
  #          137     0.0335               0.1123        3.35x   usable
  #
  # At 23px a substitute scores BETTER than San Francisco. That inversion is the
  # mechanism behind this rule's false positives, and no descriptor removes it:
  # the pixels do not carry the letterform. Real labels photographed whole
  # measured 28px (owner's genuine Pro 2) and 35px (counterfeit) - both inside
  # the dead band, which is why every real measurement so far has been
  # worthless. MEASURABLE_GLYPH_HEIGHT_PX = 45, re-derived by
  # tests/test_font_forensics.py rather than trusted.
  #
  # A richer descriptor replaced the bounding-box ratio: ink density, stroke
  # width, row and column ink profiles, and centroid, with the label's own
  # median bias removed so blur and exposure cancel. It separates San Francisco
  # from Helvetica, Arial, Verdana and Geneva by 1.7x-2.0x on clean renders and
  # 1.8x-3.8x photographed above the gate, where the bounding-box ratio was
  # erratic (Helvetica 2.69% but Geneva 8.17%).
  #
  # STILL WEIGHT 0. No counterfeit label has been photographed above the gate,
  # so there is no measured figure to set a threshold against. What is needed is
  # a close-up of a counterfeit label filling the frame; the rule now asks every
  # user for exactly that photograph, which is how the calibration set gets
  # collected.
  # source: measurement (this repository), 2026-09-07

  # PHOTOGRAPHED populations, measured through the full production path -
  # locate lines, split columns, pair by word, exclude merged and clipped
  # glyphs, pool, score. These supersede the synthetic figures below for any
  # question about real images.
  photographed_measurements:
    genuine:
      airpods_pro_2: 4.72
      airpods_4_anc: 2.39
    counterfeit:
      airpods_pro_3: 6.78
    note: >-
      The synthetic 2.0% threshold would flag BOTH genuine labels. Photographed
      print carries print texture, optical blur and sensor noise that rendered
      glyphs do not, so genuine labels scatter several times more than renders
      of the same typeface. Separation does appear to exist - genuine 2.4-4.7%
      against counterfeit 6.8% - but on two genuine samples and one counterfeit,
      with a much narrower margin than synthetic measurement implied. Not enough
      to set a threshold on.
    blocked_on: >-
      More genuine labels measured through this path, and more counterfeits. Two
      of the owner's four genuine labels did not yield enough glyphs to score -
      AirPods 4 produced 7 and AirPods Pro 1 produced 1 - so label crops also
      need to reliably capture three or more full lines.
    source: measurement

  scatter_statistic:
    genuine_photographed_labels_percent: 0.90
    san_francisco_rendered_percent: 0.42
    substitute_fonts_percent_range: [3.3, 7.9]
    threshold_percent: 2.0
    minimum_letters: 3
    # WARNING: this threshold is not yet safe to convict on. A genuine AirPods
    # Pro 1 label measured 2.25% to 5.52% depending only on where the crop edge
    # fell - barcode fragments intruding on the line corrupt segmentation, and
    # the score with it. The Label Typography rule is therefore non-
    # disqualifying until the baseline is wider and crop contamination is
    # detected.
    caveat: >-
      NOT CALIBRATED - the rule is informational, carries zero weight and cannot
      move a verdict. Four genuine labels measured natively span 0.69% to 3.0%
      scatter, while the only substitute figures available (3.3%-7.9%) come from
      SYNTHETIC renders at a much larger scale. Those populations are not
      comparable, and at 30-40px - the resolution real phone photos produce -
      genuine readings reach 3.0%, so the 2.0% threshold would flag genuine
      boxes. Calibration requires counterfeit labels photographed at comparable
      resolution, which the owner does not have.
    genuine_population_percent: [0.69, 3.0]
    substitute_population_percent_synthetic_only: [3.3, 7.9]
    source: measurement (2 genuine boxes, 4 substitute typefaces)

  # Resolution floor - the constraint that decides what this feature is FOR.
  #
  # Rendering the same string at decreasing sizes: at 29px cap height SF
  # scatters 0.94% against Helvetica's 6.32%, clean separation. At 22px SF
  # rises to 1.70%, almost touching the 2.0% threshold. Below 18px segmentation
  # fails outright - strokes merge, neighbouring glyphs join, nothing to
  # measure.
  #
  # Across the 20 labelled listing screenshots, exactly ONE contained a
  # detectable text line and its glyphs were 7px tall. So font forensics is a
  # feature for a buyer photographing a box in front of them, not a screening
  # tool for posted listing photos. Claiming otherwise would produce confident
  # nonsense on the images real users actually paste.
  resolution_floor:
    minimum_glyph_height_px: 25
    # CORRECTION. A previous value of 60px rested on my recording the AirPods
    # Pro 2 line as ~130px glyphs. That figure came from a FAILED pairing whose
    # height was measured on whatever the crop contained rather than on text;
    # measured properly the line is 32px. The 60px floor excluded all four
    # genuine labels.
    #
    # Every genuine label the owner photographed sits at 30-40px glyph height.
    # That is simply what a phone photograph of a retail box produces, so the
    # floor describes what can be MEASURED, not what can be TRUSTED.
    genuine_labels_native_px: {airpods_pro_2: 32, airpods_pro_1: 30, airpods_4: 40}
    # PROVISIONAL and under-evidenced. Native measurements: AirPods Pro 2 at
    # ~130px glyphs scored 0.90%; AirPods Pro 1 at ~30px scored 2.0-3.0%, which
    # overlaps the 3.3% where substitute typefaces begin. At 30px there is
    # effectively no separation. Nothing measured between 30 and 130px.
    #
    # METHODOLOGICAL WARNING: downscaling a sharp image is NOT equivalent to a
    # natively low-resolution capture. The 130px label downscaled to 32px scored
    # 0.92%; a real 30px capture scored 2.0-3.0%. Downscaling preserves stroke
    # structure a small sensor never recorded, so the noise curve below flatters
    # low resolutions and must not be used to set this floor.
    native_measurements: {130: 0.90, 30: 2.5}
    # Raised from 25 after downscaling a genuine label step by step. The
    # typeface never changes, so every rise is measurement noise - and it is
    # erratic rather than gradual: 32px 0.92%, 26px 0.85%, 19px 2.17%, 16px
    # 0.67%, 13px 0.31%, 10px 2.65%. Below ~26px the result is a coin flip.
    noise_curve_genuine_label: {32: 0.92, 26: 0.85, 19: 2.17, 16: 0.67, 13: 0.31, 10: 2.65}
    measured_separation_at_29px: {san_francisco: 0.94, helvetica: 6.32}
    marginal_at_22px: {san_francisco: 1.70}
    segmentation_fails_below_px: 18
    corpus_screenshots_with_scoreable_line: 1
    corpus_screenshots_total: 20
    typical_corpus_glyph_height_px: 7
    source: measurement

# Which rules are AirPods Pro 2 SPECIFIC, and which are universal.
#
# Getting this wrong produced a false accusation on a genuine AirPods 4 ANC: the
# pull-tab seal expectation is sourced from a Pro 2 guide, and it was applied to
# a product whose packaging simply differs. When the model number identifies
# another generation, the Pro 2 specific rules decline instead of guessing.
rule_scope:
  pro_2_specific:
    - Packaging Seal Type      # pull-tab seal, sourced from a Pro 2 guide
    - Copyright Year Constraint # 2022-2025, derived from Pro 2 release dates
  universal:
    - Serial Cross-Match       # Apple never repeats a serial on any product
    - Serial Label Format      # "(S) Serial" spacing seen on every genuine label here
    - Typography & Print Quality  # Apple proofreads every region's packaging
    - Model Number Compatibility  # already names other generations rather than judging them
  source: reasoning from each rule's own source, plus corpus post 5

# Serial format, now grounded in observation rather than assumption.
#
# Lengths only - a genuine serial is never recorded here, because a valid one is
# exactly what a counterfeiter needs.
#
# Every serial observed across the owner's four genuine units, seven corpus
# listings and two confirmed counterfeits is 10 characters, except the AirPods
# Pro 1 (2019) at 12. Uppercase alphanumeric throughout.
#
# NOTE what this does NOT establish: length does not discriminate. Both
# confirmed counterfeits use 10 characters, the same as genuine units. This is
# a well-formedness check that catches fabricated or misread identifiers, not a
# counterfeit tell, and it stays non-disqualifying for that reason.
serial_format:
  observed_lengths:
    10: {genuine: 3, counterfeit: 2, corpus: 7}
    12: {genuine: 1, note: AirPods Pro 1 (2019)}
  charset: uppercase alphanumeric
  discriminates_counterfeits: false
  source: owner (4 genuine units) + corpus (7 listings) + 2 confirmed counterfeits

# The tear-strip runs along a SIDE edge, so a photograph of the front face
# cannot establish that it is absent. Measured on the corpus: of four items
# failed for a missing tab, three were photographed from a side or top and one
# (post 13) from the front alone - and post 13 is the only item where this
# pipeline out-claimed the domain expert on a disqualifying rule. Requiring an
# edge view before the absence counts moved corpus agreement from 12/20 to
# 13/20 with no other verdict changing.
# source: measurement against the expert-labelled corpus, 2026-09-08
# RUN-TO-RUN STABILITY, measured 2026-09-08.
#
# A buyer acts on this once, on a phone, with money at stake. If the same
# photographs produced a different verdict on a second run, that would be a
# serious flaw and nobody had checked. Sampling is NOT pinned - no temperature,
# no seed - so variation was the thing to expect.
#
# Fifteen runs of `main.py --lite-only`, three photo sets, five runs each:
#
#   post 18, 4 photos (produces a finding)   verdict, score, failing rule,
#                                            model number, serial length, the
#                                            (S)Serial spacing and the panel
#                                            list: identical 5/5
#   post  2, 3 photos (marginal legibility)  identical 5/5, including the
#                                            fields that stayed unread
#   post 18, 2 photos (nothing legible)      verdict and score identical 5/5;
#                                            one panel label alternated between
#                                            case_exterior and other, changing
#                                            no rule and no verdict
#
# The one observed variation was a panel name on a set where every check was
# already UNKNOWN. Nothing decision-bearing moved.
#
# The likely reason is architectural rather than lucky: the extraction is
# schema-constrained server-side (response_format with additionalProperties
# false), so the sampling space is narrow and the fields are mostly copied text
# rather than generated prose.
#
# DECISION: sampling is deliberately left unpinned. Setting temperature to 0
# would make stability structural rather than observed, but it changes model
# behaviour, and the corpus agreement figure was measured under current
# settings - re-pinning without re-scoring all twenty would trade a measured
# number for an assumed one. Revisit if a future measurement shows drift.
# source: measurement (this repository), 2026-09-08

# SERIAL CROSS-MATCH RESOLVED, 2026-09-08. First time in this project.
#
# Three owner photographs - box underside label, case lid filling the frame,
# box back - run through the real pipeline with the owner's consent:
#
#   Model Number Compatibility   PASS        Serial Cross-Match     PASS
#   Packaging Seal Type          PASS        Serial Label Format    PASS
#   Copyright Year Constraint    PASS        Typography & Print     PASS
#   Serial Number Format         PASS
#   verdict GENUINE, coverage 0.95 (18.5 of 19.5, the confidence cap)
#
# The case lid serial was READ for the first time - 0 of 20 across the whole
# labelled corpus before this - and it matched the box label serial, which is
# the comparison the rule exists to make and had never been able to attempt.
#
# This is the chain closing: the check was measured never to fire, the cause
# was measured to be framing distance against the 1568px downscale, the capture
# guidance was rewritten to ask for a lid filling the frame, and a photograph
# taken that way made it resolve. The guidance is not a guess any more.
#
# Also PASSED on this unit, and worth noting because both are Pro 2 specific:
# paper pull-tab seals with green arrows and no plastic wrap, and copyright
# 2024 against a 2023 minimum.
#
# CAVEAT ON WHAT THIS IS EVIDENCE OF. It is one unit and it is not a labelled
# corpus item, so it moves no agreement figure. It demonstrates the rule CAN
# resolve on an ordinary phone photograph, not that it resolves often. It is
# also a Middle East box - TDRA ER23568/23, Arabic origin line, Apple
# Distribution International Cork - and this knowledge base characterises North
# American packaging only, so the content rules that passed here passed on a
# region they were not sourced for.
# source: owner photographs + pipeline run (this repository), 2026-09-08

# REAL-PHOTOGRAPH CHECK ON THE FRAMING CONCLUSION, 2026-09-08.
#
# The measurement below is synthetic, and its stated caveat is that it shows
# framing distance is SUFFICIENT to destroy the lid serial, not that it is the
# only cause. An owner photograph arrived the same day that tests the other
# half: a case lid shot close, filling the frame, of a unit whose box label is
# also photographed.
#
#   image as supplied           1636 x 622 (a screenshot, already reduced from
#                               whatever the camera produced)
#   pipeline downscale          0.96 - barely any, the image is already small
#   serial glyph height after   roughly 17 to 25 px
#   measured threshold          ~18px read correctly, ~9px not read at all
#
# So a lid-filling shot clears the threshold even after passing through a
# screenshot AND the downscale, which is the framing advice working end to end.
# It is legible to a human reader at full size, and the characters match the
# box label on the same unit - the comparison Serial Cross-Match exists to make
# and has never once been able to attempt.
#
# NOT YET RUN THROUGH THE PIPELINE. The photographs carry a real serial, and
# sending them to a free-tier vision API is the thing knowledge/real_* exists
# to prevent; whether to spend that is the owner's decision, not an assumption
# to make on their behalf. Held in tests/sample_data/22, which is ignored.
# source: owner photograph + measurement (this repository), 2026-09-08

# WHY THE CASE LID SERIAL IS NEVER READ, measured 2026-09-08.
#
# The legibility note below records that it is 0 of 20. This is the mechanism,
# measured on a synthetic lid rendered the way the real thing looks: laser
# etching, grey on white plastic, a specular sheen, handheld softness, sensor
# noise, and the serial at Apple's roughly 1mm on a ~60mm lid.
#
# The pipeline downscales every photograph to 1568px on the long edge before
# the model sees it. What that does to a 1mm serial depends entirely on how
# much of the frame the lid fills:
#
#   lid fills ~85% of the frame   read CORRECTLY at the shipped 1568px
#   lid fills ~35% of the frame   not read at all at 1568px
#
# So this is a photographing distance problem, not a resolution ceiling that
# needs raising. Standing back far enough to get the whole case in shot is what
# destroys it, and that is exactly what people do - the case lid was in frame in
# 7 of 20 corpus posts and legible in none of them.
#
# Raising the ceiling on the far shot walks it through a DANGEROUS band before
# it becomes correct:
#
#   1568px   serial  ~9px   not read
#   1960px   serial ~11px   LOYT6B4RKN   letter O for digit zero
#   2352px   serial ~13px   LDYT6B4RKN   letter D for digit zero
#   2744px   serial ~16px   LOYT684RKN   O for zero AND 8 for B
#   3136px   serial ~18px   correct
#
# (Serial invented; see the note on never writing a real one down.)
#
# Every error in that band is a confusable-glyph substitution, and _same_serial
# already folds exactly those (O/Q/D->0, B->8, I/L->1, S->5, Z->2, G->6) for
# COMPARISON while displaying what was read. Checked against all three
# misreadings: each folds equal to the truth, and a genuinely different serial
# still differs. The safeguard covers the precise failure mode this produces.
#
# DECISION: the ceiling is not raised. A misread serial cross-checked against a
# correctly read one is a mismatch, and a mismatch accuses a genuine unit - the
# thing this project has never once done. The fix is free and photographic:
# tell people to fill the frame with the lid, which reads correctly at the
# ceiling already shipping. If the ceiling is ever revisited, 3136px is the
# first value measured to be correct rather than merely legible.
#
# CAVEAT: the stimulus is synthetic. It establishes that framing distance is
# sufficient to cause this, not that it is the only cause in the corpus - a real
# photograph can also be out of focus or angled into a reflection.
# source: measurement (this repository), 2026-09-08

# SERIAL LEGIBILITY, measured 2026-09-08 across the 20-post labelled corpus.
#
# Apple prints a serial in four places: the box label, under the case lid, and
# on each earbud stem. Serial Cross-Match asks whether they agree, and it is the
# strongest check available - it needs no reference data, works on any
# generation, and is the only one a cloned serial cannot defeat, because a clone
# still has to agree with three other printings.
#
# It has never once run. Across 20 posts:
#
#   box label serial      legible in  7 of 20
#   case lid serial       legible in  0 of 20
#   left earbud serial    legible in  0 of 20
#   right earbud serial   legible in  0 of 20
#   posts with the 2 serials the rule needs:  0 of 20
#
# Ledger status over the whole corpus: 0 PASS, 0 FAIL, 20 UNKNOWN. The case lid
# was IDENTIFIED as photographed in 7 of those posts, so this is not a framing
# problem - the surface was in shot and the characters still could not be read.
# Apple prints them at around a millimetre, and a phone at arm's length does not
# resolve that.
#
# CONSEQUENCE FOR COVERAGE, and it is not small. The rule carries 4.0 of the
# 19.5 total, so the practical ceiling is 15.5 of 19.5 = 79.5%, not 100%. The
# 60% floor for a verdict is therefore 75% of what is actually obtainable.
#
# DECISION: nothing is reweighted. A floor that demands more of the evidence
# than intended errs toward INCONCLUSIVE, which is the safe direction and the
# one this project has repeatedly chosen. Lowering the denominator to match what
# is reachable would loosen the bar for GENUINE on exactly the checks that
# remain - and 0 fakes passed is the property every change here has had to keep.
# Revisit only with a measurement showing the case lid serial can be captured.
# source: measurement (this repository), 2026-09-08

# PHOTOGRAPH ORIENTATION, found 2026-09-08 in the same corpus post 21.
#
# A phone stores the sensor's pixels plus an EXIF tag saying which way up they
# are. Browsers apply that tag; Pillow does not, and the pipeline's JPEG
# re-encode dropped it. So a photograph looked upright to whoever uploaded it
# and reached the model rotated, with the fine print upside down.
#
# Measured on the panel itself: the encoded image differed from the stored
# pixels by 41.6 mean absolute levels and from the EXIF-corrected image by
# 0.43. It was being sent rotated by 180 degrees.
#
# IT DOES NOT EXPLAIN THE MISREADING, though it looked like it would. The
# serial misreading in the reflective-print note below came off this same
# rotated panel, so rotation was the obvious suspect. Measured instead of
# assumed, on a synthetic label with an invented serial, 180 degrees rotated
# against upright:
#
#   clean render         serial read correctly, both orientations
#   marginal contrast    4 of 4 correct upright, 4 of 4 correct rotated
#
# Twelve extractions, no difference. Below that contrast both orientations
# fail together. So the model reads upside-down print about as well as
# upright print, and rotation is NOT an alternative explanation for the
# misreading - the reflective-print account below is not displaced and
# stands as the better-supported one.
#
# The fix is still correct for reasons that have nothing to do with OCR
# accuracy: the crop box is in the coordinate space of the image the model
# was shown, and a difference hash is not rotation-invariant.
#
# Only 1 of 89 local images carries a rotation tag, which understates the
# problem badly: the corpus is screenshots, and Reddit and every upload
# pipeline strip EXIF. Camera originals reaching the deployed tool do not.
# source: measurement (this repository), 2026-09-08

# REFLECTIVE PRINT, observed 2026-09-08 on a genuine AirPods Pro 3 retail box
# (knowledge/real_app3; genuine confirmed by the owner 2026-09-08, not inferred
# from the retail price sticker that is also still attached).
#
# Newer packaging uses a finish that throws highlights, and a washed-out stroke
# is read as a different letter. "Apple" came back as "Appie" - one l-to-i
# substitution - and the box was called HIGH RISK on it. The same panel gave
# serial L0YT6B4RKN as LOYT6B4RKN, letter O for digit zero. Those characters
# are a stand-in with the same shape and the same zero in it - the observation
# is real, the serial is not. A genuine unit's serial is never written down
# here; it identifies someone's property and this repository is not the place
# for it.
#
# Neither the pattern nor the image quality separates this from a real defect:
#
#   a genuine reflective box   "Appie"     (l->i)   sharpness 220
#   a counterfeit              "Califomia" (rn->m)  sharpness  40
#   a counterfeit              "certifed"           sharpness 492
#
# The count does. Across the labelled corpus:
#
#   GENUINE               0 of 5 items reported ANY misspelling
#   HIGH_RISK_SUSPECTED   4 of 9, at counts 4, 2, 1, 1
#
# So two or more misspellings is a printing defect and one is a reading
# artefact. Measured cost: corpus posts 2 and 16 are counterfeits whose only
# evidence was a single misspelling and both fall to INCONCLUSIVE; post 15,
# where the pipeline had out-claimed the expert, is corrected. Agreement 13/20
# to 12/20, and both properties that matter hold - no counterfeit passed as
# genuine, no genuine unit accused.
#
# Confusable glyphs are folded when serials are COMPARED, never when they are
# shown, so a highlight cannot manufacture a cross-match failure.
# source: measurement against the expert-labelled corpus, 2026-09-08

# OWNER CLAIM, 2026-09-08: "If the text reflects light that instantly shows
# that it is real, because the text is high quality."
#
# Recorded because the owner is the domain expert and this is the best-sourced
# kind of material in this file. NOT implemented as a rule, for three reasons,
# in order of weight:
#
# 1. It would be the first rule that CLEARS a unit on a visual quality
#    judgement. Every visual judgement trusted so far - kerning, shoddy wrap,
#    typeface scatter - produced a false positive on first contact with a
#    photograph. A clearing rule fails in the expensive direction: it tells a
#    buyer to hand over money.
#
# 2. Two operationalisations were measured and neither separates.
#
#    Specular highlight inside the ink (bright pixels within a stroke):
#      genuine post 21 (the reflective box)   median 42  spread 26.5  p95 108
#      genuine owner Pro 2 label                     101         34.1      138
#      genuine owner AP1 label                        72         71.1      197
#      genuine owner AP4 label                        17          7.0       30
#      counterfeit label                              35         29.0       96
#      counterfeit back panel                         38         30.3       97
#    The counterfeits sit inside the genuine range on every column.
#
#    Stroke weight relative to glyph height, after the counterfeit's print
#    looked visibly fatter side by side:
#      genuine post 21   0.1495     genuine Pro 2 label  0.1786
#      genuine AP1       0.0493     counterfeit label    0.1714
#                                   counterfeit back     0.0519
#    The counterfeit label falls between two genuine labels.
#
# 3. Both measures are dominated by exposure and white balance rather than by
#    print. The claim is probably true of the physical box under a light the
#    holder controls; a single photograph under unknown lighting is a channel
#    that destroys it, which is the same finding as the typeface scatter above.
#
# WHAT WOULD MAKE IT MEASURABLE: two photographs of the same panel from
# different angles. A specular highlight MOVES between them and printed ink
# does not, which isolates the reflection from the print without needing to
# model either. That also addresses the reflective-print misreading above,
# since a word washed out at one angle is usually legible at the other. Not
# built: it needs a capture flow that asks for two angles and a comparison
# step, and no data exists yet to calibrate it.
# source: project owner (domain expert); measurement against the reference set

packaging:
  shrinkwrap:
    # Contradicts the common "wrapped = fake" claim, and contradicts the
    # project's own earlier REQUIREMENTS.md. The owner ruled in favour of this
    # version: being wrapped is not itself evidence.
    genuine_may_be_wrapped: true
    requires_side_pull_tab: true
    quality_matters: true
    source: community-guide (ruled authoritative by owner)
  # Accented words that genuinely appear on Pro 2 retail packaging, transcribed
  # from photographs of confirmed-genuine boxes. OCR routinely drops diacritics,
  # so a reported "misspelling" that matches one of these once accents are
  # stripped is an artefact of reading, not a defect in printing. Corpus post 3:
  # a genuine box printed "Audifonos inalambricos" correctly and was accused
  # because the extractor returned it without accents.
  expected_accented_words:
    - audifonos       # audifonos
    - inalambricos    # inalambricos
    - tamanos         # tamanos
    - certificacion   # certificacion
    - almohadillas
    - cargadores
    - estuche
    - empaque
    - reciclaje
    - generacion      # generacion
    - boitier         # boitier (fr)
    - source: community-guide + transcription from confirmed-genuine box photos

  paper_pull_tabs:
    description: Paper pull-tabs with green arrows on the box seams.
    source: owner

# Panel-indexed expectations. Consumed only as observation for now - panel
# identification is not yet accurate enough to drive a FAIL. Promote entries to
# rules once panel-ID accuracy is measured against a labelled corpus.
# PANEL IDENTIFICATION ACCURACY, partial measurement 2026-09-08.
#
# Two rules now depend on visible_panels being right - the pull-tab rule needs
# an edge view before a missing tab counts, and the typography rule needs a
# printed surface before a clean reading counts - so the accuracy of the panel
# list stopped being an abstract question.
#
# Nine corpus posts were re-read by hand against the extractor's panel list.
# These are the posts where those two guards decide something, not a random
# sample, so this measures the guards rather than the extractor in general:
#
#   post  5   box_front, box_side, box_back, box_bottom_label      correct
#   post  9   box_front, box_back                                  correct
#   post 11   box_front, box_back, box_side, box_bottom_label      correct
#             (two separate side shots correctly collapsed to one box_side)
#   post 13   box_front + hardware, no edge view                   correct
#   post  1   hardware only, no box                                correct
#   post 20   hardware only, no box                                correct
#   post 12   box_front + hardware                                 correct
#   post 14   box_front, box_side, box_top, box_bottom_label       correct
#   post 10   'box_top' claimed for the INSIDE of an opened box    QUESTIONABLE
#
# Eight of nine correct; the ninth mislabels an opened box's interior tray as
# box_top. That one does not reach either guard - post 10 is not wrapped, so the
# edge rule never runs, and box_top carries no printed packaging copy - but it
# is the failure mode to watch, because box_top IS an edge panel for the seal
# rule. A wrapped box photographed open could earn a FAIL it has not earned.
#
# This does NOT license promoting the panel-dependent rules in `panels` above.
# It measures two guards on nine hand-checked posts, not the extractor across
# all ten panel names.
# source: measurement against the labelled corpus (hand re-read), 2026-09-08

panels:
  box_bottom_label:
    description: Sticker label on the underside carrying part number, model numbers, UPC and serial.
    expects: [part_number, model_numbers, upc, serial_number]
    source: community-guide
  box_back:
    description: Rear panel with multilingual product description and regulatory marks.
    expects: [copyright_line, regulatory_marks]
    source: community-guide
  case_lid_underside:
    description: Serial number is printed on the underside of the case lid.
    expects: [serial_number]
    source: apple-identify
  earbud:
    description: Each earbud carries its own serial, longer than and different from the case serial.
    expects: [serial_number]
    source: community-guide

# Documented but NOT yet implemented as rules. Recorded so the knowledge is
# captured with provenance, and so it is obvious what is known-but-unused.
# Indicators catalogued by the project owner across 25 hand-verified listings.
# These are the reasons a domain expert gave for each verdict, which makes them
# the best-sourced material in this file. Counts are how often each was cited.
#
# IMPORTANT: those 25 listings are a SEPARATE reference set. Their numbering
# does not correspond to the corpus in tests/sample_data.
owner_indicator_catalogue:
  source: owner (25 hand-verified listings)
  indicators:
    - id: incorrect_font
      cited: 10
      verdict_when_present: fake
      status: partially_implemented
      note: >-
        By far the most-cited tell. Currently only reachable through
        font_kerning_irregularities, which measured 0-for-2 on the corpus and no
        longer fails on its own. Needs a sharper signal than "looks off" before
        it can be trusted - reference glyph comparison rather than a judgement.
    - id: serial_label_spacing
      cited: 2
      verdict_when_present: fake
      status: implemented
      note: >-
        No space between the (S) marker and "Serial" on the box label. Binary and
        printed, so it is trusted where subjective judgements are not. Caught a
        counterfeit the pipeline had passed as GENUINE.
    - id: grammar_errors
      cited: 6
      verdict_when_present: fake
      status: implemented
      note: Printed misspellings, via visible_spelling_errors.
    - id: shrink_wrap
      cited: 2
      verdict_when_present: fake
      status: implemented
      note: Subject to the pull-tab qualification in packaging.shrinkwrap.
    - id: copyright_2026
      cited: 2
      verdict_when_present: fake
      status: implemented
      note: >-
        A 2026 copyright is invalid on any AirPods product except AirPods Max 2.
        Corroborated independently by apple-identify, which dates AirPods Max 2
        to 2026 and every other AirPods product to 2025 or earlier. Pro 2 is
        bounded at 2025 by copyright_years.
    - id: distinct_model_numbers_per_bud
      cited: 3
      verdict_when_present: real
      status: pending
    - id: three_model_numbers_on_box_side
      cited: 2
      verdict_when_present: real
      status: pending
    - id: region_icons_match_part_number
      cited: 3
      verdict_when_present: real
      status: pending
      note: >-
        Part-number suffix encodes region (ZP/A Hong Kong, AM/A US, ZA/A
        Malaysia). The printed regulatory icons must agree with it.
    - id: aligned_peel_stickers
      cited: 1
      verdict_when_present: real
      status: pending
    - id: info_on_side_and_back_of_box
      cited: 2
      verdict_when_present: real
      status: pending
      note: Panel-dependent; needs reliable panel identification first.

# Observations from a confirmed counterfeit AirPods Pro 3 (knowledge/fake).
# Recorded, not implemented - n=1 counterfeit against n=3 genuine labels is not
# enough to write a rule on, and under-evidenced rules have produced a false
# positive every time this project has tried one.
counterfeit_observations:
  source: owner (confirmed counterfeit AirPods Pro 3, photographed)
  label_reads: "MFHP4ZM/A  AirPods Pro 3  Model A3063 A3064 A3122"
  observations:
    - id: serial_label_spacing
      detail: >-
        Prints "(S)Serial No." with no space after the (S) marker. Independent
        confirmation of the owner's most reliable single label tell, on a
        different counterfeit from the one that first showed it.
      status: already_implemented
    - id: product_of_vietnam
      detail: >-
        Reads "Product of Vietnam". The three genuine labels read "Assembled in
        Vietnam" (AirPods Pro 2, AirPods 4 ANC) or "Made in Vietnam" (AirPods
        Pro 1) - genuine phrasing varies, and "Product of" appears on neither.
      status: refuted
      refuted_by: >-
        The owner's AirPods Pro 3 (knowledge/real_app3) reads "Product of Vietnam"
        verbatim, and the owner confirmed that unit genuine on 2026-09-08. The
        claim above - that "Product of" appears on no genuine label - is false,
        and the phrase now stands at genuine 1 / counterfeit 1. It discriminates
        nothing, and shipped it would have accused a genuine unit.

        The block was right for the wrong reason: it asked for more genuine
        samples before shipping, and the first one to arrive killed the rule
        rather than sharpening it. Do not reopen without genuine samples in the
        dozens - Apple's origin phrasing varies by product and by year, and
        three labels never characterised it.
      how_the_confirmation_was_reached: >-
        The unit was first called genuine because a retail price sticker was
        still on the box, which is an inference rather than a provenance, and it
        appeared in no expert label and had no reference set. Asked directly,
        the owner confirmed it genuine. Recorded because the distinction
        matters: this rule is refuted by an owner confirmation, not by a price
        sticker. On confirmation the photographs moved from tests/sample_data/21
        to knowledge/real_app3, which is where confirmed-genuine units live and
        which is blocked from every vision API in code - they carry a real
        serial and had been sitting outside that protection.
    - id: shared_misspelling_family
      detail: >-
        Carries the same Spanish errors as corpus post 4 - inallimbricos,
        tanafios, cargaoores, Appie Watch, Chemical Bums, swalliwed - plus
        missing spaces in "Embalajedepapel" and "apple. com". Suggests a single
        counterfeit source reused across listings, which would make the
        misspelling rule sharper than a generic spell-check.
      status: partly_implemented
    - id: model_numbers_are_genuine
      detail: >-
        Model A3063 A3064 A3122 are Apple's real AirPods Pro 3 numbers. The
        model-number check cannot catch this counterfeit, which is exactly why
        it must not be the only Tier 1 rule.
      status: informative

# RESOLVED: lowercase characterised, and glyphs pooled across lines.
#
# Lowercase adds a, c, f, k, m, r, s, t, z (i, l, h, w excluded - too thin, blur
# destroys their aspect ratio, S/N 0.3 and 0.1 for i and l). That takes
# "Designed by Apple in California", present on every Apple box, from one usable
# glyph to six letters.
#
# Six was still not enough. On that single line Arial scored 1.36% - identical
# to San Francisco - and passed as genuine, because whether a substitute is
# caught depends on which letters the line happens to contain. Pooling glyphs
# across lines fixes it:
#
#   lines  glyphs      SF   Helvetica   Arial   Verdana   Tahoma   all caught
#       1       6   1.36%     5.67%    1.36%     6.07%    6.97%       NO
#       2      12   0.51%     5.11%    6.89%     6.07%    5.86%       yes
#       4      32   0.62%     5.11%    7.13%     6.68%    6.94%       yes
#
# The glyph floor sits at 15, above where it starts working.
minimum_glyphs_to_score: 15
pooling_measurements:
  one_line: {san_francisco: 1.36, arial: 1.36, caught: false}
  two_lines: {san_francisco: 0.51, arial: 6.89, caught: true}
  four_lines: {san_francisco: 0.62, arial: 7.13, caught: true}
  source: measurement

# Superseded note, kept for the reasoning: USABLE LETTERS PER LINE.
#
# Automatic line detection works - 7 lines on the counterfeit label, 9 on its
# back panel, in under a third of a second, with bounds taken from the
# components so nothing clips. Measurement runs end to end. What fails is that
# label lines rarely carry three usable letters:
#
#   serial codes are digit-heavy (HGHP9X4047 offers only S, S, G)
#   model-number lines are almost entirely digits
#   digits are tabular, so they deviate uniformly and carry no per-glyph signal
#
# USABLE_GLYPHS was derived for uppercase and digits only. The line that would
# solve this appears on every Apple box - "Designed by Apple in California" -
# but it is mixed case, and lowercase letterforms have never been characterised.
# Doing that is the highest-value next step for the font path.
#
# STATUS ON REAL PHOTOGRAPHS: still not calibrated, and the reason has moved
# again. The mechanism is sound on synthetic renders - pooled across four lines,
# San Francisco scores 0.62% against 5.1%-7.1% for every substitute tested. On
# photographs the failure is now PAIRING, not detection or resolution.
#
# compare/measure requires the component count to equal the character count
# exactly. Real print breaks that constantly: glyphs touch, glyphs break,
# punctuation segments unpredictably, and a label with two text columns puts
# unrelated words on one detected row. Measured on real labels:
#
#   counterfeit Pro 3, pooled over 3 lines -> 17 glyphs, scatter 6.78%, differs
#   genuine AirPods Pro 2, same path       -> 10 glyphs, scatter 31.06%, garbage
#
# The counterfeit figure must NOT be read as a result. Until a genuine label
# measures cleanly through the same path, one number in isolation shows nothing;
# the genuine run producing 31% proves the path is unreliable rather than that
# the box is fake.
#
# Next piece: pairing that tolerates insertions and deletions - sequence
# alignment on horizontal position, scoring only confidently matched glyphs -
# instead of demanding exact count equality.
#
# Font calibration status against this counterfeit: NOT ACHIEVED. Its serial
# line is digit-heavy (only S, S, G are usable letters, and clipping removed
# them), and digits are tabular so they carry no per-glyph signal. Its back
# panel has ample text but locating a specific line by hand hits a different
# failure each attempt - wrong row selected, glyphs clipped, letters too few.
# Automatic text-line location is the blocker, not the absence of counterfeit
# photographs.

pending_rules:
  # IMPLEMENTED as the Serial Cross-Match rule (Tier 1, disqualifying).
  # The only check here that cannot be defeated by cloning: it asks whether one
  # item's identifiers agree with each other, not whether a serial exists in
  # Apple's records. A counterfeiter copying a genuine serial passes
  # checkcoverage.apple.com but would have to reproduce four consistent serials
  # across box, case lid and both earbuds to pass this.
  #
  # The "longer than the case" clause from the guide is deliberately NOT
  # implemented. Apple's own serial lengths vary (10 and 12 characters both
  # appear on the owner's genuine units), and no source states the earbud serial
  # is always longer, so that would be an invented specification.
  - id: missing_accents
    statement: >-
      Accented characters rendered without their accents (e.g. "inalambricos"
      for "inalambricos") indicate a reproduction.
    blocked_on: Extractor must distinguish a missing accent from OCR loss.
    source: community-guide
  - id: part_number_region
    statement: >-
      The part number suffix encodes region (e.g. AM/A, ZA/A) and should agree
      with the regulatory marks printed on the box.
    blocked_on: Part number and region marks are not extracted yet.
    source: community-guide
  - id: distinct_serials_per_bud
    statement: >-
      Each earbud carries its own model number and serial, distinct from the
      other bud and from the case. Matching serials across components indicate a
      counterfeit.
    blocked_on: Extraction of per-component identifiers tagged by panel.
    source: owner (25 hand-verified listings)
  - id: region_icon_consistency
    statement: >-
      The part-number region suffix (ZP/A, AM/A, ZA/A, LL/A) must agree with the
      regulatory icons printed on the box.
    blocked_on: Part number and regulatory marks are not extracted yet.
    source: owner (25 hand-verified listings) + community-guide
  - id: sticker_geometry
    statement: >-
      The bottom sticker sits about 1mm above the box bottom edge, with its
      first line bolded and labels aligned.
    blocked_on: Requires geometric measurement, not text extraction.
    source: community-guide
