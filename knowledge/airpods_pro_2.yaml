# Ground truth for AirPods Pro 2. Data only - rule logic lives in rules_engine.py.
#
# EVERY factual entry carries a `source`. Nothing goes in this file because it
# sounds right; if it has no source it does not belong here. Sources used:
#
#   apple-identify   Apple, "Identify your AirPods" (support.apple.com)
#   owner            Project owner, domain expert in AirPods authentication
#   community-guide  r/AreMyAirpodsAuthentic, "How To Tell If Your Airpod Pros
#                    Are Fake - A Comprehensive and Definitive Guide"
#
# Precedence when sources disagree: apple-identify > owner > community-guide.

product:
  name: AirPods Pro 2
  generation: 2

variants:
  - id: Pro 2 USB-C
    introduced: 2023
    source: apple-identify
  - id: Pro 2 Lightning
    introduced: 2022
    source: apple-identify

# Apple lists the three set numbers together without saying which is the left
# earbud, the right earbud, or the case. Where the component is genuinely
# unspecified by the source it is left null rather than guessed - the rule only
# needs set membership and variant, so inventing the mapping would add
# unsourced detail to the ledger for no benefit.
model_numbers:
  - number: A3047
    variant: Pro 2 USB-C
    component: null
    source: apple-identify
  - number: A3048
    variant: Pro 2 USB-C
    component: null
    source: apple-identify
  - number: A3049
    variant: Pro 2 USB-C
    component: null
    source: apple-identify
  - number: A2968
    variant: Pro 2 USB-C
    component: MagSafe Charging Case (USB-C)
    source: apple-identify   # Apple names this one explicitly as the case
  - number: A2931
    variant: Pro 2 Lightning
    component: null
    source: apple-identify
  - number: A2699
    variant: Pro 2 Lightning
    component: null
    source: apple-identify
  - number: A2698
    variant: Pro 2 Lightning
    component: null
    source: apple-identify
  - number: A2700
    variant: Pro 2 Lightning
    component: MagSafe Charging Case (Lightning)
    source: apple-identify   # Apple names this one explicitly as the case

# Other AirPods Pro generations. These are recorded for IDENTIFICATION ONLY -
# this tool verifies Pro 2 and nothing else. Without them, an A-number from
# another generation is indistinguishable from a fabricated one, and the schema
# forces the extractor to mislabel the product as a Pro 2.
#
# Corpus evidence for why this matters: A3063 appeared on one confirmed
# counterfeit and one confirmed genuine unit. It is an AirPods Pro 3 number -
# the posts were a fake Pro 3 and a real one, and the tool could not say so.
# Other AirPods products, for IDENTIFICATION ONLY - this tool verifies Pro 2 and
# nothing else. Without them an A-number from another generation is
# indistinguishable from a fabricated one, and the extractor is forced to
# mislabel the product as a Pro 2.
#
# Earbuds and charging cases are listed SEPARATELY because Apple lists them
# separately and their years differ. An earlier version of this file merged them,
# which put A3059 (a 2024 case) inside the AirPods 4 ANC earbud entry and dated
# every AirPods Max to 2020.
other_generations:
  - name: AirPods Pro 3
    introduced: 2025
    numbers: [A3063, A3064, A3065]
    source: apple-identify
  - name: AirPods Pro 1
    introduced: 2019
    numbers: [A2084, A2083]
    source: apple-identify
  - name: AirPods 4 with Active Noise Cancellation
    introduced: 2024
    numbers: [A3056, A3055, A3057]
    source: apple-identify
  - name: AirPods 4
    introduced: 2024
    numbers: [A3053, A3050, A3054]
    source: apple-identify
  - name: AirPods 3
    introduced: 2021
    numbers: [A2565, A2564]
    source: apple-identify
  - name: AirPods 2
    introduced: 2019
    numbers: [A2032, A2031]
    source: apple-identify
  - name: AirPods 1
    introduced: 2016
    numbers: [A1523, A1722]
    source: apple-identify
  - name: AirPods Max 2
    introduced: 2026
    numbers: [A3454]
    source: apple-identify
  - name: AirPods Max 1 (USB-C)
    introduced: 2024
    numbers: [A3184]
    source: apple-identify
  - name: AirPods Max 1 (Lightning)
    introduced: 2020
    numbers: [A2096]
    source: apple-identify

# Charging cases, which carry their own model numbers and years.
charging_cases:
  - name: Wireless Charging Case for AirPods 4 (ANC)
    introduced: 2024
    numbers: [A3059]
    source: apple-identify
  - name: Charging Case for AirPods 4
    introduced: 2024
    numbers: [A3058]
    source: apple-identify
  - name: MagSafe Charging Case for AirPods Pro 3
    introduced: 2025
    numbers: [A3122]
    source: apple-identify
  - name: Lightning Charging Case for AirPods 3
    introduced: 2022
    numbers: [A2897]
    source: apple-identify
  - name: MagSafe Charging Case for AirPods 3
    introduced: 2021
    numbers: [A2566]
    source: apple-identify
  # A2190 covers TWO different cases distinguished only by serial suffix.
  - name: MagSafe Charging Case for AirPods Pro 1
    introduced: 2021
    numbers: [A2190]
    serial_last_four: [1059, 1NRC]
    source: apple-identify
  - name: AirPods Pro 1 Charging Case
    introduced: 2019
    numbers: [A2190]
    serial_last_four: [0C6L, LKKT]
    source: apple-identify
  - name: Wireless Charging Case (AirPods 1 and 2)
    introduced: 2019
    numbers: [A1938]
    source: apple-identify
  - name: Lightning Charging Case (AirPods 1 and 2)
    introduced: 2016
    numbers: [A1602]
    source: apple-identify

# A checkable constraint Apple states outright: the last four characters of an
# AirPods Pro 1 case serial are drawn from a fixed set. Anything else on an
# A2190 case is not a genuine Apple serial for that case.
#
# Validated against the owner's genuine Pro 1 label, whose serial ends 1059 -
# the MagSafe Charging Case for AirPods Pro 1.
#
# Not implemented as a rule yet: this tool verifies Pro 2, and Apple publishes no
# equivalent suffix constraint for the Pro 2 cases. Recorded so it is ready when
# Pro 1 verification is added.
case_serial_suffixes:
  A2190:
    - suffixes: [1059, 1NRC]
      case: MagSafe Charging Case for AirPods Pro 1
      introduced: 2021
    - suffixes: [0C6L, LKKT]
      case: AirPods Pro 1 Charging Case
      introduced: 2019
  source: apple-identify

copyright_years:
  Pro 2 USB-C:
    min: 2023
    max: 2025
    source: apple-identify (introduced 2023); owner (observed ceiling 2025)
  Pro 2 Lightning:
    min: 2022
    max: 2025
    source: apple-identify (introduced 2022); owner (observed ceiling 2025)

# Regional box variants. Packaging CONTENT varies by region - languages,
# regulatory marks, part-number suffix - so a rule written against one region's
# box does not transfer. Typography does NOT vary: Apple sets every region in
# San Francisco, so the font baseline below is region-independent even though
# the reference photographs are North American.
#
# Only NA is characterised. Do not write content rules for other regions
# without a genuine reference box from that region.
regions:
  - code: AM/A
    name: North America
    reference_photos: knowledge/real_app2
    reference_part_number: MTJV3AM/A
    # NEVER record a genuine serial here. A real, valid serial is precisely what
    # a counterfeiter wants: cloning one produces a fake that passes Apple's own
    # coverage lookup, which is the failure this project exists to detect.
    observed_on_label:
      - "MTJV3AM/A  AirPods Pro (2nd generation)"
      - "Designed by Apple in California. Assembled in Vietnam."
      - "Model A3047 A3048 A2968"
      - "(S) Serial No. <redacted - genuine serial, never record one>"
    regulatory_marks: [CSA (Energy Verified Only)]
    languages: [English, French, Japanese, Spanish]
    source: owner (genuine unit, photographed 2026-09-06)
  - code: ZP/A
    name: Hong Kong
    status: uncharacterised
    source: community-guide (mentioned only)
  - code: ZA/A
    name: Malaysia / Thailand
    status: uncharacterised
    source: community-guide (mentioned only)

# Measured against a confirmed-genuine North American label. Seven usable glyphs
# from the "(S) Serial No." line sat at 1.68% mean deviation from San
# Francisco, 3.34% worst case - so genuine print lands well inside the 8%
# provisional threshold. ONE label is a sanity check, not a calibration; a real
# threshold needs several genuine boxes and at least one confirmed counterfeit.
font_baseline:
  reference_font: San Francisco (/System/Library/Fonts/SFNS.ttf)
  measured_on: knowledge/real_app2/IMG_6337.JPG
  region: AM/A
  line: "(S) Serial No. <redacted>"
  glyphs_measured: 7
  mean_absolute_deviation_percent: 1.68
  max_absolute_deviation_percent: 3.34
  excluded_glyph: Q
  excluded_reason: >-
    Both Q's measured -8.6% and -12.1% on genuine print. SF's Q has a tail
    crossing the bowl whose survival through printing and segmentation varies.
    Passed the synthetic screen; failed against reality.
  source: owner (genuine unit) + measurement

  # The offset above is NOT the signal. Measured on two genuine labels it was
  # +2.4% (AirPods Pro 2) and -6.0% (AirPods 4 ANC) - a difference caused by
  # image scale and ink spread, not typeface. -6.0% is indistinguishable from
  # Arial's synthetic -5.9%, so an absolute-deviation threshold would flag a
  # genuine box.
  #
  # Scatter is the signal. Typefaces differ from one another non-uniformly (SF
  # vs Helvetica: 22% on R, 8% on S), so a wrong font makes per-glyph deviations
  # disagree while genuine print makes them agree. Measured populations:
  #
  #   genuine photographed labels   0.90%   (both boxes, independently)
  #   San Francisco rendered        0.42%
  #   Helvetica / Arial / Verdana / Tahoma   3.3% - 7.9%
  #
  # Threshold set at 2.0%, between the populations rather than at either edge.
  #
  # Digits cannot be scored. Most typefaces set tabular figures, so digits
  # deviate uniformly: on a digits-only line SF scatters 0.71% and Helvetica
  # 0.71%. A line needs at least 3 letters.
  scatter_statistic:
    genuine_photographed_labels_percent: 0.90
    san_francisco_rendered_percent: 0.42
    substitute_fonts_percent_range: [3.3, 7.9]
    threshold_percent: 2.0
    minimum_letters: 3
    # WARNING: this threshold is not yet safe to convict on. A genuine AirPods
    # Pro 1 label measured 2.25% to 5.52% depending only on where the crop edge
    # fell - barcode fragments intruding on the line corrupt segmentation, and
    # the score with it. The Label Typography rule is therefore non-
    # disqualifying until the baseline is wider and crop contamination is
    # detected.
    caveat: >-
      NOT CALIBRATED - the rule is informational, carries zero weight and cannot
      move a verdict. Four genuine labels measured natively span 0.69% to 3.0%
      scatter, while the only substitute figures available (3.3%-7.9%) come from
      SYNTHETIC renders at a much larger scale. Those populations are not
      comparable, and at 30-40px - the resolution real phone photos produce -
      genuine readings reach 3.0%, so the 2.0% threshold would flag genuine
      boxes. Calibration requires counterfeit labels photographed at comparable
      resolution, which the owner does not have.
    genuine_population_percent: [0.69, 3.0]
    substitute_population_percent_synthetic_only: [3.3, 7.9]
    source: measurement (2 genuine boxes, 4 substitute typefaces)

  # Resolution floor - the constraint that decides what this feature is FOR.
  #
  # Rendering the same string at decreasing sizes: at 29px cap height SF
  # scatters 0.94% against Helvetica's 6.32%, clean separation. At 22px SF
  # rises to 1.70%, almost touching the 2.0% threshold. Below 18px segmentation
  # fails outright - strokes merge, neighbouring glyphs join, nothing to
  # measure.
  #
  # Across the 20 labelled listing screenshots, exactly ONE contained a
  # detectable text line and its glyphs were 7px tall. So font forensics is a
  # feature for a buyer photographing a box in front of them, not a screening
  # tool for posted listing photos. Claiming otherwise would produce confident
  # nonsense on the images real users actually paste.
  resolution_floor:
    minimum_glyph_height_px: 25
    # CORRECTION. A previous value of 60px rested on my recording the AirPods
    # Pro 2 line as ~130px glyphs. That figure came from a FAILED pairing whose
    # height was measured on whatever the crop contained rather than on text;
    # measured properly the line is 32px. The 60px floor excluded all four
    # genuine labels.
    #
    # Every genuine label the owner photographed sits at 30-40px glyph height.
    # That is simply what a phone photograph of a retail box produces, so the
    # floor describes what can be MEASURED, not what can be TRUSTED.
    genuine_labels_native_px: {airpods_pro_2: 32, airpods_pro_1: 30, airpods_4: 40}
    # PROVISIONAL and under-evidenced. Native measurements: AirPods Pro 2 at
    # ~130px glyphs scored 0.90%; AirPods Pro 1 at ~30px scored 2.0-3.0%, which
    # overlaps the 3.3% where substitute typefaces begin. At 30px there is
    # effectively no separation. Nothing measured between 30 and 130px.
    #
    # METHODOLOGICAL WARNING: downscaling a sharp image is NOT equivalent to a
    # natively low-resolution capture. The 130px label downscaled to 32px scored
    # 0.92%; a real 30px capture scored 2.0-3.0%. Downscaling preserves stroke
    # structure a small sensor never recorded, so the noise curve below flatters
    # low resolutions and must not be used to set this floor.
    native_measurements: {130: 0.90, 30: 2.5}
    # Raised from 25 after downscaling a genuine label step by step. The
    # typeface never changes, so every rise is measurement noise - and it is
    # erratic rather than gradual: 32px 0.92%, 26px 0.85%, 19px 2.17%, 16px
    # 0.67%, 13px 0.31%, 10px 2.65%. Below ~26px the result is a coin flip.
    noise_curve_genuine_label: {32: 0.92, 26: 0.85, 19: 2.17, 16: 0.67, 13: 0.31, 10: 2.65}
    measured_separation_at_29px: {san_francisco: 0.94, helvetica: 6.32}
    marginal_at_22px: {san_francisco: 1.70}
    segmentation_fails_below_px: 18
    corpus_screenshots_with_scoreable_line: 1
    corpus_screenshots_total: 20
    typical_corpus_glyph_height_px: 7
    source: measurement

packaging:
  shrinkwrap:
    # Contradicts the common "wrapped = fake" claim, and contradicts the
    # project's own earlier REQUIREMENTS.md. The owner ruled in favour of this
    # version: being wrapped is not itself evidence.
    genuine_may_be_wrapped: true
    requires_side_pull_tab: true
    quality_matters: true
    source: community-guide (ruled authoritative by owner)
  # Accented words that genuinely appear on Pro 2 retail packaging, transcribed
  # from photographs of confirmed-genuine boxes. OCR routinely drops diacritics,
  # so a reported "misspelling" that matches one of these once accents are
  # stripped is an artefact of reading, not a defect in printing. Corpus post 3:
  # a genuine box printed "Audifonos inalambricos" correctly and was accused
  # because the extractor returned it without accents.
  expected_accented_words:
    - audifonos       # audifonos
    - inalambricos    # inalambricos
    - tamanos         # tamanos
    - certificacion   # certificacion
    - almohadillas
    - cargadores
    - estuche
    - empaque
    - reciclaje
    - generacion      # generacion
    - boitier         # boitier (fr)
    - source: community-guide + transcription from confirmed-genuine box photos

  paper_pull_tabs:
    description: Paper pull-tabs with green arrows on the box seams.
    source: owner

# Panel-indexed expectations. Consumed only as observation for now - panel
# identification is not yet accurate enough to drive a FAIL. Promote entries to
# rules once panel-ID accuracy is measured against a labelled corpus.
panels:
  box_bottom_label:
    description: Sticker label on the underside carrying part number, model numbers, UPC and serial.
    expects: [part_number, model_numbers, upc, serial_number]
    source: community-guide
  box_back:
    description: Rear panel with multilingual product description and regulatory marks.
    expects: [copyright_line, regulatory_marks]
    source: community-guide
  case_lid_underside:
    description: Serial number is printed on the underside of the case lid.
    expects: [serial_number]
    source: apple-identify
  earbud:
    description: Each earbud carries its own serial, longer than and different from the case serial.
    expects: [serial_number]
    source: community-guide

# Documented but NOT yet implemented as rules. Recorded so the knowledge is
# captured with provenance, and so it is obvious what is known-but-unused.
# Indicators catalogued by the project owner across 25 hand-verified listings.
# These are the reasons a domain expert gave for each verdict, which makes them
# the best-sourced material in this file. Counts are how often each was cited.
#
# IMPORTANT: those 25 listings are a SEPARATE reference set. Their numbering
# does not correspond to the corpus in tests/sample_data.
owner_indicator_catalogue:
  source: owner (25 hand-verified listings)
  indicators:
    - id: incorrect_font
      cited: 10
      verdict_when_present: fake
      status: partially_implemented
      note: >-
        By far the most-cited tell. Currently only reachable through
        font_kerning_irregularities, which measured 0-for-2 on the corpus and no
        longer fails on its own. Needs a sharper signal than "looks off" before
        it can be trusted - reference glyph comparison rather than a judgement.
    - id: serial_label_spacing
      cited: 2
      verdict_when_present: fake
      status: implemented
      note: >-
        No space between the (S) marker and "Serial" on the box label. Binary and
        printed, so it is trusted where subjective judgements are not. Caught a
        counterfeit the pipeline had passed as GENUINE.
    - id: grammar_errors
      cited: 6
      verdict_when_present: fake
      status: implemented
      note: Printed misspellings, via visible_spelling_errors.
    - id: shrink_wrap
      cited: 2
      verdict_when_present: fake
      status: implemented
      note: Subject to the pull-tab qualification in packaging.shrinkwrap.
    - id: copyright_2026
      cited: 2
      verdict_when_present: fake
      status: implemented
      note: >-
        A 2026 copyright is invalid on any AirPods product except AirPods Max 2.
        Corroborated independently by apple-identify, which dates AirPods Max 2
        to 2026 and every other AirPods product to 2025 or earlier. Pro 2 is
        bounded at 2025 by copyright_years.
    - id: distinct_model_numbers_per_bud
      cited: 3
      verdict_when_present: real
      status: pending
    - id: three_model_numbers_on_box_side
      cited: 2
      verdict_when_present: real
      status: pending
    - id: region_icons_match_part_number
      cited: 3
      verdict_when_present: real
      status: pending
      note: >-
        Part-number suffix encodes region (ZP/A Hong Kong, AM/A US, ZA/A
        Malaysia). The printed regulatory icons must agree with it.
    - id: aligned_peel_stickers
      cited: 1
      verdict_when_present: real
      status: pending
    - id: info_on_side_and_back_of_box
      cited: 2
      verdict_when_present: real
      status: pending
      note: Panel-dependent; needs reliable panel identification first.

# Observations from a confirmed counterfeit AirPods Pro 3 (knowledge/fake).
# Recorded, not implemented - n=1 counterfeit against n=3 genuine labels is not
# enough to write a rule on, and under-evidenced rules have produced a false
# positive every time this project has tried one.
counterfeit_observations:
  source: owner (confirmed counterfeit AirPods Pro 3, photographed)
  label_reads: "MFHP4ZM/A  AirPods Pro 3  Model A3063 A3064 A3122"
  observations:
    - id: serial_label_spacing
      detail: >-
        Prints "(S)Serial No." with no space after the (S) marker. Independent
        confirmation of the owner's most reliable single label tell, on a
        different counterfeit from the one that first showed it.
      status: already_implemented
    - id: product_of_vietnam
      detail: >-
        Reads "Product of Vietnam". The three genuine labels read "Assembled in
        Vietnam" (AirPods Pro 2, AirPods 4 ANC) or "Made in Vietnam" (AirPods
        Pro 1) - genuine phrasing varies, and "Product of" appears on neither.
      status: candidate
      blocked_on: >-
        One counterfeit against three genuine labels. Apple's phrasing already
        varies between genuine products, so a rule here needs enough genuine
        samples to know the full set of legitimate wordings.
    - id: shared_misspelling_family
      detail: >-
        Carries the same Spanish errors as corpus post 4 - inallimbricos,
        tanafios, cargaoores, Appie Watch, Chemical Bums, swalliwed - plus
        missing spaces in "Embalajedepapel" and "apple. com". Suggests a single
        counterfeit source reused across listings, which would make the
        misspelling rule sharper than a generic spell-check.
      status: partly_implemented
    - id: model_numbers_are_genuine
      detail: >-
        Model A3063 A3064 A3122 are Apple's real AirPods Pro 3 numbers. The
        model-number check cannot catch this counterfeit, which is exactly why
        it must not be the only Tier 1 rule.
      status: informative

# RESOLVED: lowercase characterised, and glyphs pooled across lines.
#
# Lowercase adds a, c, f, k, m, r, s, t, z (i, l, h, w excluded - too thin, blur
# destroys their aspect ratio, S/N 0.3 and 0.1 for i and l). That takes
# "Designed by Apple in California", present on every Apple box, from one usable
# glyph to six letters.
#
# Six was still not enough. On that single line Arial scored 1.36% - identical
# to San Francisco - and passed as genuine, because whether a substitute is
# caught depends on which letters the line happens to contain. Pooling glyphs
# across lines fixes it:
#
#   lines  glyphs      SF   Helvetica   Arial   Verdana   Tahoma   all caught
#       1       6   1.36%     5.67%    1.36%     6.07%    6.97%       NO
#       2      12   0.51%     5.11%    6.89%     6.07%    5.86%       yes
#       4      32   0.62%     5.11%    7.13%     6.68%    6.94%       yes
#
# The glyph floor sits at 15, above where it starts working.
minimum_glyphs_to_score: 15
pooling_measurements:
  one_line: {san_francisco: 1.36, arial: 1.36, caught: false}
  two_lines: {san_francisco: 0.51, arial: 6.89, caught: true}
  four_lines: {san_francisco: 0.62, arial: 7.13, caught: true}
  source: measurement

# Superseded note, kept for the reasoning: USABLE LETTERS PER LINE.
#
# Automatic line detection works - 7 lines on the counterfeit label, 9 on its
# back panel, in under a third of a second, with bounds taken from the
# components so nothing clips. Measurement runs end to end. What fails is that
# label lines rarely carry three usable letters:
#
#   serial codes are digit-heavy (HGHP9X4047 offers only S, S, G)
#   model-number lines are almost entirely digits
#   digits are tabular, so they deviate uniformly and carry no per-glyph signal
#
# USABLE_GLYPHS was derived for uppercase and digits only. The line that would
# solve this appears on every Apple box - "Designed by Apple in California" -
# but it is mixed case, and lowercase letterforms have never been characterised.
# Doing that is the highest-value next step for the font path.
#
# Font calibration status against this counterfeit: NOT ACHIEVED. Its serial
# line is digit-heavy (only S, S, G are usable letters, and clipping removed
# them), and digits are tabular so they carry no per-glyph signal. Its back
# panel has ample text but locating a specific line by hand hits a different
# failure each attempt - wrong row selected, glyphs clipped, letters too few.
# Automatic text-line location is the blocker, not the absence of counterfeit
# photographs.

pending_rules:
  - id: serial_cross_match
    statement: >-
      Box serial must match the case-lid serial. Each earbud carries its own
      serial, longer than and different from the case serial. An earbud serial
      equal to the case or box serial means counterfeit.
    blocked_on: Extraction of multiple serials tagged by panel.
    source: community-guide
  - id: missing_accents
    statement: >-
      Accented characters rendered without their accents (e.g. "inalambricos"
      for "inalambricos") indicate a reproduction.
    blocked_on: Extractor must distinguish a missing accent from OCR loss.
    source: community-guide
  - id: part_number_region
    statement: >-
      The part number suffix encodes region (e.g. AM/A, ZA/A) and should agree
      with the regulatory marks printed on the box.
    blocked_on: Part number and region marks are not extracted yet.
    source: community-guide
  - id: distinct_serials_per_bud
    statement: >-
      Each earbud carries its own model number and serial, distinct from the
      other bud and from the case. Matching serials across components indicate a
      counterfeit.
    blocked_on: Extraction of per-component identifiers tagged by panel.
    source: owner (25 hand-verified listings)
  - id: region_icon_consistency
    statement: >-
      The part-number region suffix (ZP/A, AM/A, ZA/A, LL/A) must agree with the
      regulatory icons printed on the box.
    blocked_on: Part number and regulatory marks are not extracted yet.
    source: owner (25 hand-verified listings) + community-guide
  - id: sticker_geometry
    statement: >-
      The bottom sticker sits about 1mm above the box bottom edge, with its
      first line bolded and labels aligned.
    blocked_on: Requires geometric measurement, not text extraction.
    source: community-guide
