name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyflakes

      - name: Lint
        run: python -m pyflakes *.py tests/*.py tools/*.py

      # No credentials are set: the rules engine is pure Python and both vision
      # providers are driven by stub clients, so the suite must pass offline.
      # If a test ever needs a real API key, it belongs behind a marker.
      - name: Test
        run: python -m pytest -q

  schema-contract:
    # The extraction schema is what stops the LLM returning a verdict. If it
    # ever loses additionalProperties:false, the guarantee is gone silently.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Assert the extraction boundary still holds
        run: |
          python - <<'PY'
          from schema import VisionExtraction
          schema = VisionExtraction.model_json_schema()
          assert schema["additionalProperties"] is False, "LLM could return extra fields"
          assert set(schema["required"]) == set(schema["properties"]), "nullable != optional"
          print("Extraction boundary intact:", len(schema["properties"]), "required fields")
          PY

  web:
    # The sheet restates the rule table so the browser can draw the register
    # without a round trip. `test_web_contract.py` fails when the two drift,
    # and the build proves the page still compiles.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      - name: Build the sheet
        working-directory: web
        run: npm run build
      - name: Check nothing published carries a serial
        run: |
          python3 - <<'PY'
          import json, pathlib, re, sys
          blob = pathlib.Path("web/src/data/specimens.json").read_text()
          leaked = [t for t in re.findall(r"\b[A-Z0-9]{10}\b", blob)
                    if any(c.isdigit() for c in t) and any(c.isalpha() for c in t)]
          if leaked:
              sys.exit(f"unredacted serial-shaped tokens published: {leaked}")
          print("filed records carry no readable serial")
          PY

  container:
    # The image is the only artifact that can carry a reference photograph off
    # this machine, and one serial has already had to be purged from git
    # history once. Build it on every change so a broken Dockerfile or a leaked
    # path is caught here rather than at deploy.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t airpods-verifier:ci .
      - name: It starts, serves the sheet, and says what it cannot do
        run: |
          docker run -d --name sheet -p 8080:8080 airpods-verifier:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/api/examine >/dev/null 2>&1; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8080/ | grep -q "Examination record"
          curl -fsS http://127.0.0.1:8080/about | grep -q "How the record"
          curl -fsS http://127.0.0.1:8080/api/examine | grep -q '"concurrency":1'
          docker logs sheet
      - name: No reference photograph reached the image
        run: |
          docker run --rm --entrypoint sh airpods-verifier:ci -c '
            if ls knowledge/real_* knowledge/fake 2>/dev/null | grep -q .; then
              echo "reference photographs are inside the image"; exit 1
            fi
            echo "knowledge/ carries only the sourced YAML:"; ls knowledge/
          '
